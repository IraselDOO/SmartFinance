services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartfinance-web:latest
    container_name: smartfinance-web
    restart: unless-stopped
    ports:
      - "${PORT_BIND:-127.0.0.1:3200}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-info@smartfinance.me}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
